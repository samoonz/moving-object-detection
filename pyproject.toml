[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moving-object-detection"
version = "0.1.0"
description = "Camera-motion-robust moving object detection using SEA-RAFT and robust multiview geometry."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
